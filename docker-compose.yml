services:
  cadence:
    image: ghcr.io/gavndev/cadence:latest
    container_name: cadence
    ports:
      - "8765:8000"
    environment:
      CADENCE_USERNAME: admin
      CADENCE_PASSWORD: password
      CADENCE_BUILTIN_LIBRARY: /DATA/AppData/cadence/library
      CADENCE_MUSIC_LIBRARY: /DATA/Media/Music
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /DATA/AppData/cadence/config:/config
      - /DATA/AppData/cadence/library:/DATA/AppData/cadence/library
      - /DATA/Media/Music:/DATA/Media/Music
    restart: unless-stopped
