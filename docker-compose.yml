services:
  cadence:
    image: ghcr.io/gavndev/cadence:latest
    container_name: cadence
    ports:
      - "8765:8000"
    environment:
      CADENCE_USERNAME: admin
      CADENCE_PASSWORD: password
      MUSIC_LIBRARY: /music
    volumes:
      - /DATA/AppData/cadence/library:/music
    restart: unless-stopped
